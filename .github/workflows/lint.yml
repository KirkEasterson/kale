---
name: "lint"

on: ["push"] # yamllint disable-line rule:truthy

jobs:

  yamllint:

    name: "yamllint"
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - run: "make lint-yaml"

  ansible-lint:
    name: "ansible-lint"
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - run: "make lint-ansible"
